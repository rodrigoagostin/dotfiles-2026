set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB:extkeys"
set -s escape-time 0
set -s extended-keys on
set -g focus-events on
set -g allow-passthrough on
set -g set-clipboard on
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g display-time 2000
setw -g mode-keys vi

bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind x kill-pane
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind C-l send-keys C-l
bind C-j send-keys C-j

bind g display-popup -E -w 95% -h 95% -d "#{pane_current_path}" lazygit

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

set -g status-style bg=default,fg=colour240
set -g status-left "#[fg=colour245,bold] #S  "
set -g status-left-length 30
set -g status-right "#[fg=colour240]%H:%M "
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[fg=colour255,bold] #I #W "
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour245
set -g message-style bg=default,fg=colour255
